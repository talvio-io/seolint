<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>404 — Page not found | SEOlint</title>
    <link rel="icon" href="favicon.ico" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #14261d;
        --violet: #8fbf08;
        --violet-deep: #164d36;
        --butter: #d8fa39;
        --mint: #8de51d;
        --display: "Space Grotesk", sans-serif;
        --body: "Manrope", sans-serif;
        --mono: "DM Mono", monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        text-align: center; color: white; font-family: var(--body);
        background: radial-gradient(ellipse at 50% 94%, rgba(220,255,71,.98) 0%, rgba(165,221,14,.86) 22%, rgba(67,141,23,.52) 43%, transparent 65%), radial-gradient(ellipse at 84% 18%, rgba(30,102,64,.94) 0%, transparent 50%), linear-gradient(145deg, #071d1c 0%, #0d4b35 39%, #60990f 72%, #a9dd11 100%);
      }
      .wrap { max-width: 480px; padding: 24px; }
      .code { font-family: var(--mono); font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.74); margin-bottom: 12px; }
      h1 { font: 700 clamp(40px, 8vw, 64px)/1 var(--display); letter-spacing: -.04em; margin: 0 0 16px; }
      p { font-size: 14px; line-height: 1.7; color: rgba(255,255,255,.8); margin: 0 0 28px; }
      a { display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 7px; color: #173a25; background: #efffc0; font-weight: 800; font-size: 12px; text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="code">Error 404</div>
      <h1>This page ran off too.</h1>
      <p>The page you're looking for doesn't exist in this archive. It may have been moved, renamed, or never existed.</p>
      <a href="/">← Back to SEOlint</a>
    </div>
  </body>
</html>
